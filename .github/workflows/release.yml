name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK and NDK
        run: bash scripts/setup-android.sh
      - name: Resolve version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use vMAJOR.MINOR.PATCH"; exit 1; }
          else
            version=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v1.0.0)
          fi
          echo "VERSION_TAG=$version" >> "$GITHUB_ENV"
      - name: Configure signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            [[ -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]] || { echo 'Configure os quatro Secrets de assinatura'; exit 1; }
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easypiano.jks"
            chmod 600 "$RUNNER_TEMP/easypiano.jks"
            {
              echo "PIANO_KEYSTORE_PATH=$RUNNER_TEMP/easypiano.jks"
              echo "PIANO_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "PIANO_KEY_ALIAS=$KEY_ALIAS"
              echo "PIANO_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo '::warning::Sem Secrets: APK de teste assinado com chave debug. Configure chave permanente para atualizações.'
          fi
      - name: Check samples
        run: python3 scripts/verify-samples.py
      - name: Test native sampler
        run: g++ -std=c++17 -O2 tests/sampler_test.cpp -o /tmp/sampler-test && /tmp/sampler-test
      - name: Test and build signed release
        run: ./gradlew --no-daemon test assembleRelease lintRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: EasyPiano-${{ env.VERSION_TAG }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release.apk.sha256 \
            --title "EasyPiano $GITHUB_REF_NAME" --generate-notes
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/easypiano.jks"
